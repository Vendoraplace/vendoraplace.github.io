/** Photo → resized JPEG blob (max 1280px). Re-encoding strips EXIF incl. GPS. */
function compress(file) {
  return new Promise((ok, fail) => {
    if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)) return fail(new Error('Только JPG, PNG или WEBP'));
    const img = new Image(); img.onerror = () => fail(new Error('Не удалось открыть фото'));
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => (b ? ok(b) : fail(new Error('Ошибка сжатия'))), 'image/jpeg', 0.8); URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  });
}
async function uploadImage(file) {
  const blob = await compress(file);
  const path = `${uid()}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}.jpg`;
  await Q(sb.storage.from('images').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false }));
  return sb.storage.from('images').getPublicUrl(path).data.publicUrl;
}

}

function parseSmart(q) {
  const s = q.toLowerCase(), f = { q: '' };
  const max = s.match(/(?:до|under|below|gacha|<)\s*\$?\s*(\d[\d\s]*)/); if (max) f.max = +max[1].replace(/\s/g, '');
  const min = s.match(/(?:от|from|over|dan)\s*\$?\s*(\d[\d\s]*)/); if (min) f.min = +min[1].replace(/\s/g, '');
  if (/рядом|near|yaqin|поблизости/.test(s)) f.near = 1;
  if (/нов|new|yangi/.test(s)) f.cond = 'NEW'; if (/б\/у|бу |used|ishlatilgan/.test(s)) f.cond = 'USED';
  const map = { phones: /телефон|смартфон|iphone|phone|samsung|telefon/, computers: /ноутбук|компьютер|laptop|macbook|pc/, cars: /авто|машин|car|avto/, shoes: /обув|кроссов|sneaker|shoe/, furniture: /мебел|диван|sofa|стол/, electronics: /часы|watch|наушник|электрон/, sports: /велосипед|спорт|bike|sport/, 'real-estate': /квартир|дом|apartment/ };
  for (const [c, r] of Object.entries(map)) if (r.test(s)) { f.cat = c; break; }
  const words = s.replace(/(до|от|under|from|рядом со мной|рядом|near me|near|\$|\d+|хороший|хорошую|good|найди|найти|find|мне|me|я|новый|б\/у|used|new)/g, ' ').split(/\s+/).filter((w) => w.length > 2);
  if (!f.cat) f.q = words.slice(0, 3).join(' ');
  else { const brand = s.match(/iphone|samsung|macbook|nike|apple|chevrolet/); if (brand) f.q = brand[0]; }
  return f;
}

const dropPct = (l) => { const h = l.price_history || []; const mx = Math.max(...h.map((p) => +p.p), +l.price); return mx > l.price ? Math.round((mx - l.price) / mx * 100) : 0; };

const cleanQ = (s) => s.replace(/[,()%*\\.:"']/g, ' ').trim().split(/\s+/).filter(Boolean).slice(0, 5);

async function searchListings(p, limit = 24) {
  let qb = sb.from('listings').select(CARD, { count: 'exact' }).eq('status', 'ACTIVE');
  for (const w of cleanQ(p.q || '')) qb = qb.or(`title.ilike.%${w}%,description.ilike.%${w}%`);
  if (p.cat) qb = qb.eq('category', p.cat);
  if (p.min) qb = qb.gte('price', +p.min); if (p.max) qb = qb.lte('price', +p.max);
  if (p.cond) qb = qb.eq('condition', p.cond);
  if (p.city && !p.lat) qb = qb.ilike('city', cleanQ(p.city).join(' ') || '%');
  if (p.seller) qb = qb.eq('seller_id', p.seller);
  if (p.lat) {
    const { data } = await QC(qb.not('lat_approx', 'is', null).limit(1000));
    let items = data.map((l) => ({ ...l, dist: Math.round(km(+p.lat, +p.lng, l.lat_approx, l.lng_approx) * 10) / 10 })).filter((l) => l.dist <= +(p.radius || 10));
    const s = p.sort || 'dist';
    items.sort(s === 'asc' ? (a, b) => a.price - b.price : s === 'desc' ? (a, b) => b.price - a.price : s === 'pop' ? (a, b) => b.views - a.views : (a, b) => a.dist - b.dist);
    const page = +(p.page || 1);
    return { items: items.slice((page - 1) * limit, page * limit), total: items.length };
  }
  const s = p.sort || 'new';
  qb = s === 'asc' ? qb.order('price', { ascending: true }) : s === 'desc' ? qb.order('price', { ascending: false }) : s === 'pop' ? qb.order('views', { ascending: false }) : qb.order('promoted', { ascending: false }).order('created_at', { ascending: false });
  const page = +(p.page || 1);
  const { data, count } = await QC(qb.range((page - 1) * limit, page * limit - 1));
  return { items: data, total: count ?? data.length };
}

  }
  const c = await Q(sb.from('conversations').select('*, listing:listings(id,title,price,currency,area,city), buyer:profiles!conversations_buyer_id_fkey(id,first_name,last_name), seller:profiles!conversations_seller_id_fkey(id,first_name,last_name)').eq('id', id).maybeSingle());
  if (!c) return `<div class="container-v py-16">${emptyBox('Диалог не найден')}</div>`;
  const msgs = await Q(sb.from('messages').select('*').eq('conv_id', id).order('created_at').limit(500));
  await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('conv_id', id).is('read_at', null).neq('sender_id', uid());
  const other = c.buyer_id === uid() ? c.seller : c.buyer, seller = c.seller_id === uid();
  const blocked = (await Q(sb.from('blocks').select('blocked_id').eq('blocked_id', other.id))).length > 0;
  const priv = c.address_shared ? await Q(sb.from('listing_private').select('address_exact').eq('listing_id', c.listing_id).maybeSingle()).catch(() => null) : null;
  CHAT = { id, conv: c, messages: msgs, seller };
  subscribeChat(id);
  return `<div class="flex flex-col h-[calc(100dvh-4rem)] max-w-3xl mx-auto bg-white md:border-x border-navy-100">
    <div class="glass rounded-none border-x-0 border-t-0 flex items-center gap-3 p-3"><a href="#/messages" class="btn-ghost h-10 w-10 p-0">${icon('arrow-left')}</a>
      <a href="#/item/${c.listing_id}" class="min-w-0 flex-1"><p class="font-semibold truncate">${esc(other.first_name)} ${esc((other.last_name || '')[0] || '')}.</p><p class="text-xs text-navy-900/60 truncate">${esc(c.listing?.title)} · ${c.listing ? money(c.listing.price, c.listing.currency) : ''}</p></a>
      ${seller && !c.address_shared ? `<button data-act="shareAddr" data-id="${id}" class="btn-ghost h-10 w-10 p-0" title="Открыть точный адрес">${icon('map-pin')}</button>` : ''}
      <button data-act="block" data-id="${other.id}" class="btn-ghost h-10 w-10 p-0 text-red-600" title="Заблокировать">${icon('ban')}</button></div>
    ${c.address_shared ? `<div class="bg-emerald-50 text-emerald-800 text-xs px-4 py-2">📍 ${esc(priv?.address_exact || [c.listing?.city, c.listing?.area].filter(Boolean).join(', '))}</div>` : ''}
    <div id="msgs" class="flex-1 overflow-y-auto px-3 py-4 space-y-2 bg-[#f7f8fc]">${msgsHtml()}</div>
    ${blocked ? '<p class="p-4 text-center text-sm text-navy-900/50">🚫 Вы заблокировали этого пользователя</p>' : `<form data-form="msg" data-id="${id}" class="flex items-end gap-2 p-3 border-t border-navy-100 bg-white">
      <label class="btn-secondary h-11 w-11 p-0 shrink-0 cursor-pointer">${icon('image-plus')}<input type="file" accept="image/*" hidden data-act="msgImg" data-id="${id}"></label>
      ${!seller ? `<button type="button" data-act="offer" data-id="${id}" class="btn-secondary h-11 w-11 p-0 shrink-0" title="${t('offer')}">${icon('badge-dollar-sign')}</button>` : ''}
      <input name="text" autocomplete="off" placeholder="Сообщение…" class="input h-11" maxlength="4000"><button class="btn-primary h-11 w-11 p-0 shrink-0">${icon('send')}</button></form>`}
  </div>`;
};
function msgsHtml() {
  const { messages, seller, conv } = CHAT;
  if (!messages.length) return `<p class="text-center text-sm text-navy-900/40 py-10">Начните диалог. Не переводите предоплату незнакомцам.</p>`;
  return messages.map((m) => {
    const mine = m.sender_id === uid();
    return `<div class="flex ${mine ? 'justify-end' : 'justify-start'}"><div class="max-w-[80%] rounded-2xl px-3.5 py-2 text-[15px] shadow-sm ${mine ? 'bg-brand-gradient text-white rounded-br-md' : 'bg-white rounded-bl-md'}">
      ${m.image_url ? `<a href="${esc(m.image_url)}" target="_blank" rel="noopener"><img src="${esc(m.image_url)}" class="rounded-xl max-h-64 mb-1"></a>` : ''}${m.text ? `<p class="whitespace-pre-wrap break-words">${esc(m.text)}</p>` : ''}
      ${m.offer_amount ? `<p class="text-xs mt-1 font-semibold">${{ PENDING: '⏳ ждёт ответа', ACCEPTED: '✅ принято', REJECTED: '❌ отклонено', WITHDRAWN: '↩ заменено новым' }[m.offer_status] || ''}</p>` : ''}
      ${m.offer_status === 'PENDING' && seller ? `<div class="flex gap-2 mt-2"><button data-act="offerResp" data-id="${m.id}" data-ok="1" class="btn h-8 px-3 text-xs bg-emerald-500 text-white">${t('accept')}</button><button data-act="offerResp" data-id="${m.id}" class="btn h-8 px-3 text-xs bg-navy-50 text-navy-900">${t('decline')}</button></div>` : ''}
      <div class="flex items-center gap-1 justify-end text-[10px] mt-0.5 ${mine ? 'text-white/70' : 'text-navy-900/40'}">${!mine ? `<button data-act="reportMsg" data-id="${m.id}" title="${t('report')}">⚑</button> ` : ''}${ftime(m.created_at)}${mine ? (m.read_at ? ' ✓✓' : ' ✓') : ''}</div></div></div>`;
  }).join('') + (conv ? '' : '');
}
function redrawMsgs() { const box = $('#msgs'); if (!box || !CHAT) return; box.innerHTML = msgsHtml(); box.scrollTop = box.scrollHeight; window.lucide?.createIcons?.(); }
let CHAT_CH = null;
function subscribeChat(id) {
  if (CHAT_CH) sb.removeChannel(CHAT_CH);
  CHAT_CH = sb.channel('conv-' + id).on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: `conv_id=eq.${id}` }, (pl) => {
    if (!CHAT || CHAT.id !== id) return;
    const m = pl.new; const i = CHAT.messages.findIndex((x) => x.id === m.id);
    if (i >= 0) CHAT.messages[i] = m; else CHAT.messages.push(m);
    redrawMsgs();
    if (pl.eventType === 'INSERT' && m.sender_id !== uid()) sb.from('messages').update({ read_at: new Date().toISOString() }).eq('id', m.id).then(() => 0);
  }).subscribe();
}

// ---------------- router ----------------
function parse() {
  const [path, q] = location.hash.slice(1).split('?'); const parts = (path || '/').split('/').filter(Boolean);
  return { name: parts[0] || 'home', arg: parts[1], params: Object.fromEntries(new URLSearchParams(q || '')) };
}
let RENDER_ID = 0;
async function render() {
  const myId = ++RENDER_ID, r = parse();
  if (r.name !== 'messages' || !r.arg) { if (CHAT_CH) { sb.removeChannel(CHAT_CH); CHAT_CH = null; } CHAT = null; }
  renderShell(); window.lucide?.createIcons?.();
  const page = PAGES[r.name];
  if (!page) { $('#app').innerHTML = `<div class="container-v py-24 text-center"><p class="font-display text-7xl font-extrabold text-gradient">404</p><a href="#/" class="btn-primary mt-6">VENDORA</a></div>`; return; }
  $('#app').innerHTML = spinner;
  let html;
  try { html = await page(r.params, r.arg); }
  catch (e) { console.error(e); html = `<div class="container-v py-16">${emptyBox('Не удалось загрузить', esc(errText(e)), '<button data-act="reload" class="btn-primary">Повторить</button>')}</div>`; }
  if (myId !== RENDER_ID) return; // a newer navigation happened
  $('#app').innerHTML = html;
  if (r.name === 'sell') drawImgs();
  if (r.name === 'item' && html.includes('id="conv"')) {
    const priceEl = html.match(/data-price="([^"]+)"/);
    sb.from('listings').select('price,currency').eq('id', r.arg).maybeSingle().then(({ data }) => {
      if (data && ST.currency !== data.currency) convert(+data.price, data.currency, ST.currency).then((v) => { const el = $('#conv'); if (el && v != null) el.textContent = `≈ ${money(v, ST.currency)} · курс ${LOCAL.rates.src}`; });
    });
  }
  if (r.name === 'messages' && r.arg) { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }
  document.title = 'VENDORA — BUY SMART. SELL ANYWHERE.';
  window.lucide?.createIcons?.();
  refreshUnread();
}
async function refreshUnread() { try { const n = await unreadCount(); if (n !== UNREAD) { UNREAD = n; renderShell(); window.lucide?.createIcons?.(); } } catch { /* offline */ } }
window.addEventListener('hashchange', () => { render(); if (!location.hash.includes('img=')) window.scrollTo(0, 0); });

function geo() { return new Promise((ok, fail) => navigator.geolocation ? navigator.geolocation.getCurrentPosition((p) => ok([p.coords.latitude, p.coords.longitude]), () => fail(), { timeout: 10000 }) : fail()); }

  clearCity() { ST.city = ''; saveLocal(); const p = parse().params; delete p.city; go('#/search?' + new URLSearchParams(p)); },
  async near() { try { const [a, b] = await geo(); const p = parse().params; ST.city = ''; saveLocal(); go('#/search?' + new URLSearchParams({ ...p, lat: a.toFixed(4), lng: b.toFixed(4), radius: p.radius || 10, sort: 'dist', city: '' })); } catch { toast('Доступ к геолокации запрещён', 'err'); } },
  async smartNear(el) { try { const [a, b] = await geo(); go('#/search?' + new URLSearchParams({ smart: 1, sq: el.dataset.q, lat: a.toFixed(4), lng: b.toFixed(4) })); } catch { toast('Доступ к геолокации запрещён', 'err'); } },
  async mapNear() { try { const [a, b] = await geo(); go(`#/map?lat=${a.toFixed(4)}&lng=${b.toFixed(4)}&radius=${parse().params.radius || 10}`); } catch { toast('Доступ к геолокации запрещён', 'err'); } },
  async myLoc() { try { const [a, b] = await geo(); const f = $('form[data-form=sell]'); f.lat.value = a; f.lng.value = b; $('#locOut').textContent = a.toFixed(4) + ', ' + b.toFixed(4); } catch { toast('Доступ к геолокации запрещён', 'err'); } },
  filters() {
    const p = parse().params;
    modal(t('filters'), `<form data-form="filters" class="space-y-4"><div><span class="label">${t('price')}</span><div class="flex gap-2"><input name="min" class="input" inputmode="decimal" placeholder="${t('from')}" value="${esc(p.min || '')}"><input name="max" class="input" inputmode="decimal" placeholder="${t('to')}" value="${esc(p.max || '')}"></div></div>
      <label class="block"><span class="label">${t('condition')}</span><select name="cond" class="input"><option value="">${t('all')}</option><option value="NEW" ${p.cond === 'NEW' ? 'selected' : ''}>${t('new')}</option><option value="USED" ${p.cond === 'USED' ? 'selected' : ''}>${t('used')}</option></select></label>
      <label class="block"><span class="label">${t('city')}</span><select name="city" class="input"><option value="">${t('all')}</option>${Object.keys(CITIES).map((c) => `<option ${p.city === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      ${p.lat ? `<label class="block"><span class="label">${t('radius')}, km</span><input name="radius" type="number" min="1" max="500" class="input" value="${esc(p.radius || 10)}"></label>` : ''}
      <div class="flex gap-2"><button type="button" data-act="resetFilters" class="btn-secondary flex-1">${t('reset')}</button><button class="btn-primary flex-1">${t('apply')}</button></div></form>`);
  },
  resetFilters() { closeModal(); const p = parse().params; ST.city = ''; saveLocal(); go('#/search' + (p.cat ? '?cat=' + p.cat : '')); },
  addImg() { $('#fileIn').click(); },
  imgDel(el) { SELL_IMAGES.splice(+el.dataset.i, 1); drawImgs(); window.lucide?.createIcons?.(); },
  imgFirst(el) { const [x] = SELL_IMAGES.splice(+el.dataset.i, 1); SELL_IMAGES.unshift(x); drawImgs(); window.lucide?.createIcons?.(); },
  async smartPrice() {
    const f = $('form[data-form=sell]'), title = f.title.value.toLowerCase(), cat = f.cat.value, cur = f.currency.value;
    if (!cat || !title) return toast('Укажите название и категорию', 'err');
    const words = cleanQ(title).filter((w) => w.length > 2).slice(0, 3);
    let qb = sb.from('listings').select('price').eq('category', cat).eq('currency', cur).in('status', ['ACTIVE', 'SOLD']).limit(200);
    if (words.length) qb = qb.or(words.map((w) => `title.ilike.%${w}%`).join(','));
    if (f.dataset.id) qb = qb.neq('id', f.dataset.id);
    const pr = (await Q(qb)).map((x) => +x.price).sort((a, b) => a - b);
    if (!pr.length) { $('#spOut').textContent = 'Пока недостаточно похожих объявлений для оценки.'; return; }
    const med = pr[Math.floor(pr.length / 2)];
    $('#spOut').innerHTML = `Похожих: ${pr.length}, медиана <b>${money(med, cur)}</b> (${money(pr[0], cur)}–${money(pr[pr.length - 1], cur)}) <button type="button" class="text-brand-600 font-semibold" onclick="this.form.price.value=${med}">применить</button>`;
  },
  async ord(el) {
    const s = el.dataset.s;
    if (s === 'CANCELLED' && !confirm(t('cancel') + '?')) return;
    if (s === 'COMPLETED' && !confirm('Подтвердить получение товара?')) return;
    await Q(sb.rpc('order_move', { p_id: el.dataset.id, p_to: s, p_note: null })); render();
  },
  ship(el) { modal('Отправка', `<form data-form="ship" data-id="${el.dataset.id}" class="space-y-3"><input name="track" class="input" placeholder="Трек-номер (необязательно)" maxlength="80"><button class="btn-primary w-full">${t('apply')}</button></form>`); },
  dispute(el) { modal('Открыть спор', `<form data-form="dispute" data-id="${el.dataset.id}" class="space-y-3"><textarea name="reason" class="textarea" minlength="10" required placeholder="Опишите проблему (мин. 10 символов)"></textarea><button class="btn-primary w-full">${t('send')}</button></form>`); },
  async mfaOn() {
    const { data: fx } = await sb.auth.mfa.listFactors();
    for (const f of (fx?.all || []).filter((x) => x.status !== 'verified')) await sb.auth.mfa.unenroll({ factorId: f.id });
    const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'VENDORA ' + Date.now().toString(36) });
    if (error) throw error;
    $('#mfaBox').innerHTML = `<div class="space-y-3 pt-2"><p class="text-sm">1. Установите <b>Google Authenticator</b> и нажмите «+» → «Сканировать QR-код» (или «Ввести ключ»).</p>
      <img src="${esc(data.totp.qr_code)}" alt="QR" class="h-48 w-48 mx-auto bg-white rounded-xl p-2 border border-navy-100">
      <p class="text-xs text-center break-all">Ключ: <b class="select-all">${esc(data.totp.secret)}</b></p>
      <form data-form="mfaEnroll" data-id="${data.id}" class="space-y-2"><p class="text-sm">2. Введите 6-значный код из приложения:</p><input name="code" inputmode="numeric" maxlength="6" class="input text-center text-xl tracking-[0.4em] font-bold" required><div id="err"></div><button class="btn-primary w-full">Подтвердить</button></form></div>`;
  },
  async mfaOff(el) { if (!confirm('Отключить 2FA? Аккаунт станет менее защищённым.')) return; await Q(sb.auth.mfa.unenroll({ factorId: el.dataset.id })); await sb.auth.refreshSession(); toast('2FA отключена'); render(); },
  async modSet(el) { if (!confirm(el.dataset.on ? 'Назначить модератором?' : 'Снять права модератора?')) return; await Q(sb.rpc('owner_set_moderator', { p_email: el.dataset.email, p_on: !!el.dataset.on })); toast('Готово'); render(); },
  async admBlock(el) { await Q(sb.from('listings').update({ status: 'BLOCKED' }).eq('id', el.dataset.id)); await Q(sb.from('reports').update({ status: 'RESOLVED' }).eq('id', el.dataset.r)); toast('Объявление заблокировано'); render(); },
  async admReport(el) { await Q(sb.from('reports').update({ status: el.dataset.s }).eq('id', el.dataset.id)); render(); },
  async admLst(el) { await Q(sb.from('listings').update({ status: el.dataset.s }).eq('id', el.dataset.id)); render(); },
  async admUser(el) { if (!confirm(el.dataset.b ? 'Заблокировать пользователя?' : 'Разблокировать?')) return; await Q(sb.from('profiles').update({ is_blocked: !!el.dataset.b }).eq('id', el.dataset.id)); render(); },
};

const FORMS = {
  topSearch(f) { go('#/search?q=' + encodeURIComponent(f.q.value.trim())); },
  smart(f) { const q = f.q.value.trim(); if (q) go('#/search?smart=1&sq=' + encodeURIComponent(q)); },
  filters(f) { const p = { ...parse().params, ...Object.fromEntries(new FormData(f)) }; delete p.page; delete p.smart; delete p.sq; ST.city = p.city || ''; saveLocal(); closeModal(); go('#/search?' + new URLSearchParams(Object.entries(p).filter(([, v]) => v))); },
  async register(f) {
    const d = Object.fromEntries(new FormData(f)), err = (m) => { $('#err').innerHTML = notice(m, 1); toast(m, 'err'); };
    if (d.vd_hp) return err('Проверка на робота не пройдена');
    const NAME = /^[\p{L}][\p{L}\p{M}' -]{0,49}$/u;
    if (!NAME.test(d.firstName.trim()) || !NAME.test(d.lastName.trim())) return err('Укажите имя и фамилию (только буквы)');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim())) return err('Некорректный email');
    const bad = PW_RULES.filter(([, r]) => !r(d.password)).map(([l]) => l); if (bad.length) return err('Пароль слишком простой: нужно ' + bad.join(', '));
    if (d.password !== d.password2) return err('Пароли не совпадают');
    if (!d.agree) return err('Примите условия использования');
    const { data, error } = await sb.auth.signUp({ email: d.email.trim().toLowerCase(), password: d.password, options: { emailRedirectTo: SITE, data: { first_name: d.firstName.trim(), last_name: d.lastName.trim(), city: ST.city || 'Tashkent' } } });
    if (error) return err(errText(error));
    if (data.session) { toast('Аккаунт создан'); go('#/account'); }
    else $('#app').innerHTML = authCard('Проверьте почту', `<p class="text-center text-sm">Мы отправили письмо на <b>${esc(d.email)}</b>. Откройте ссылку из письма, чтобы подтвердить email. Если письма нет — проверьте «Спам».</p><a href="#/login" class="btn-primary w-full mt-6">${t('login')}</a>`);
  },
  async login(f) {
    const err = (m) => { $('#err').innerHTML = notice(m, 1); toast(m, 'err'); };
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim().toLowerCase(), password: f.password.value });
    if (error) return err(errText(error));
    const next = f.dataset.next && f.dataset.next.startsWith('#/') ? f.dataset.next : '#/';
    const lv = await aal();
    if (lv.next === 'aal2' && lv.current !== 'aal2') return go('#/mfa?next=' + encodeURIComponent(next));
    toast('С возвращением!'); go(next);
  },
  async mfa(f) {
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: f.dataset.id, code: f.code.value.trim() });
    if (error) { $('#err').innerHTML = notice(errText(error), 1); return; }
    await onAuth((await sb.auth.getSession()).data.session); toast('Вход подтверждён');
    const n = f.dataset.next; go(n && n.startsWith('#/') ? n : '#/');
  },
  async mfaEnroll(f) {
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: f.dataset.id, code: f.code.value.trim() });
    if (error) { $('#err').innerHTML = notice(errText(error), 1); return; }
    await onAuth((await sb.auth.getSession()).data.session); toast('2FA включена'); render();
  },
  async forgot(f) {
    const { error } = await sb.auth.resetPasswordForEmail(f.email.value.trim().toLowerCase(), { redirectTo: SITE + '#/reset' });
    if (error) { $('#err').innerHTML = notice(errText(error), 1); return; }
    $('#app').innerHTML = authCard('Проверьте почту', `<p class="text-center text-sm">Если аккаунт с таким email есть, мы отправили ссылку для смены пароля.</p>`);
  },
  async reset(f) {
    const err = (m) => { $('#err').innerHTML = notice(m, 1); toast(m, 'err'); };
    const bad = PW_RULES.filter(([, r]) => !r(f.p1.value)).map(([l]) => l); if (bad.length) return err('Нужно: ' + bad.join(', '));
    if (f.p1.value !== f.p2.value) return err('Пароли не совпадают');
    const { error } = await sb.auth.updateUser({ password: f.p1.value }); if (error) return err(errText(error));
    toast('Пароль изменён'); go('#/account');
  },
  async changePw(f) { await FORMS.reset(f); },
  async profile(f) {
    const d = Object.fromEntries([...new FormData(f)].map(([k, v]) => [k, String(v).trim()]));
    if (!d.first_name) return toast('Укажите имя', 'err');
    PROFILE = await Q(sb.from('profiles').update(d).eq('id', uid()).select().single()); toast('Сохранено'); render();
  },
  async store(f) { PROFILE = await Q(sb.from('profiles').update({ store_name: f.store_name.value.trim() || null, store_color: f.store_color.value }).eq('id', uid()).select().single()); toast('Магазин сохранён'); },
  async sell(f, e) {
    const d = new FormData(f), draft = e.submitter?.name === 'draft', id = f.dataset.id, errs = [];
    const title = d.get('title').trim(), desc = d.get('desc').trim(), price = +String(d.get('price')).replace(',', '.').replace(/\s/g, ''), delivery = d.getAll('delivery');
    if (title.length < 3) errs.push('название (мин. 3 символа)'); if (desc.length < 10) errs.push('описание (мин. 10 символов)');
    if (!(price >= 0) || d.get('price') === '') errs.push('цену'); if (!d.get('cat')) errs.push('категорию'); if (!SELL_IMAGES.length) errs.push('хотя бы одно фото'); if (!delivery.length) errs.push('способ получения');
    if (errs.length) return toast('Заполните: ' + errs.join(', '), 'err');
    const city = d.get('city'), lat = +d.get('lat') || null, lng = +d.get('lng') || null;
    const c0 = CITIES[city] || CITIES.Tashkent;
    const row = { title, description: desc, price, currency: d.get('currency'), category: d.get('cat'), condition: d.get('cond'), city, area: d.get('area').trim() || null,
      lat_approx: lat ?? c0[0], lng_approx: lng ?? c0[1], delivery, delivery_fee: d.get('fee') ? +d.get('fee') : null, delivery_days: d.get('days') ? +d.get('days') : null, images: [...SELL_IMAGES] };
    let listingId = id;
    if (id) await Q(sb.from('listings').update(row).eq('id', id));
    else listingId = (await Q(sb.from('listings').insert({ ...row, status: draft ? 'DRAFT' : 'ACTIVE' }).select('id').single())).id;
    const addr = d.get('addressExact').trim();
    if (addr || lat) await Q(sb.from('listing_private').upsert({ listing_id: listingId, address_exact: addr || null, lat, lng }));
    toast(id ? 'Сохранено' : draft ? 'Черновик сохранён' : 'Объявление опубликовано — его видят все!');
    go(draft || id ? '#/account/listings' : '#/item/' + listingId);
  },
  async ask(f) { if (!requireAuth()) return; await Q(sb.from('questions').insert({ listing_id: f.dataset.id, text: f.text.value.trim() })); render(); },
  async answer(f) { await Q(sb.from('questions').update({ answer: f.text.value.trim() }).eq('id', f.dataset.id)); render(); },
  async msg(f) {
    const v = f.text.value.trim(); if (!v) return;
    f.text.value = '';
    const m = await Q(sb.from('messages').insert({ conv_id: f.dataset.id, text: v }).select().single());
    if (CHAT && !CHAT.messages.some((x) => x.id === m.id)) { CHAT.messages.push(m); redrawMsgs(); }
    f.text.focus();
  },
  async offer(f) {
    const amount = +f.amount.value.replace(',', '.').replace(/\s/g, ''); if (!(amount > 0)) return toast('Введите сумму', 'err');
    const cur = CHAT?.conv?.listing?.currency || 'USD';
    await Q(sb.from('messages').insert({ conv_id: f.dataset.id, text: `💰 Предложение цены: ${money(amount, cur)}`, offer_amount: amount })); closeModal();
  },
  async order(f) {
    const method = f.method.value, addr = f.address.value.trim();
    if (method !== 'BUYER_PICKUP' && !addr) return toast('Укажите адрес доставки', 'err');
    const o = await Q(sb.from('orders').insert({ listing_id: f.dataset.id, method, address: addr || null }).select('id').single());
    LOCAL.cart = LOCAL.cart.filter((x) => x !== f.dataset.id); saveLocal(); closeModal(); toast('Заказ оформлен. Продавец получит его в кабинете'); go('#/order/' + o.id);
  },
  async ship(f) { closeModal(); await Q(sb.rpc('order_move', { p_id: f.dataset.id, p_to: 'SHIPPED', p_note: f.track.value.trim() || null })); render(); },
  async dispute(f) { closeModal(); await Q(sb.rpc('order_move', { p_id: f.dataset.id, p_to: 'DISPUTED', p_note: f.reason.value.trim() })); render(); },
  async review(f) { await Q(sb.from('reviews').insert({ order_id: f.dataset.id, target_id: f.dataset.target, rating: +f.rating.value, text: f.text.value.trim() || null })); toast('Спасибо за отзыв!'); render(); },
  async modAdd(f) { await Q(sb.rpc('owner_set_moderator', { p_email: f.email.value.trim(), p_on: true })); toast('Модератор назначен'); render(); },
  async report(f) { await Q(sb.from('reports').insert({ listing_id: f.dataset.id, reason: f.reason.value, details: f.details.value.trim() || null })); closeModal(); toast('Жалоба отправлена модераторам'); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act] && el.tagName !== 'SELECT' && el.tagName !== 'INPUT') {
    Promise.resolve().then(() => ACT[el.dataset.act](el, e)).catch((er) => { console.error(er); toast(errText(er), 'err'); });
    if (el.tagName === 'A' && el.dataset.act === 'fav') e.preventDefault();
  }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = e.submitter || f.querySelector('button:not([type=button])'), label = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="inline-block h-4 w-4 rounded-full border-2 border-current border-t-transparent animate-spin"></span>'; }
  Promise.resolve().then(() => FORMS[f.dataset.form]?.(f, e))
    .catch((er) => { console.error(er); toast(errText(er), 'err'); })
    .finally(() => { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; window.lucide?.createIcons?.(); } });
});
document.addEventListener('change', async (e) => {
  const el = e.target, a = el.dataset.act;
  try {
    if (el.id === 'fileIn') {
      const files = [...el.files].slice(0, 15 - SELL_IMAGES.length); el.value = '';
      for (const file of files) { toast('Загружаю фото…'); SELL_IMAGES.push(await uploadImage(file)); drawImgs(); window.lucide?.createIcons?.(); }
    }
    if (a === 'sort') { const p = parse().params; p.sort = el.value; delete p.page; go('#/search?' + new URLSearchParams(p)); }
    if (a === 'setLang') { ST.lang = el.value; saveLocal(); closeModal(); render(); }
    if (a === 'setCur') { ST.currency = el.value; saveLocal(); closeModal(); render(); }
    if (a === 'radius') { const p = parse().params; go(`#/map?lat=${p.lat || ''}&lng=${p.lng || ''}&radius=${el.value}`); }
    if (a === 'avatar' && el.files[0]) { const url = await uploadImage(el.files[0]); PROFILE = await Q(sb.from('profiles').update({ avatar_url: url }).eq('id', uid()).select().single()); render(); }
    if (a === 'msgImg' && el.files[0]) { toast('Отправляю фото…'); const url = await uploadImage(el.files[0]); await Q(sb.from('messages').insert({ conv_id: el.dataset.id, image_url: url })); }
  } catch (er) { console.error(er); toast(errText(er), 'err'); }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act === 'pwMeter') $('#pwm').innerHTML = PW_RULES.map(([l, r]) => `<span class="${r(e.target.value) ? 'text-emerald-600' : 'text-navy-900/45'}">${r(e.target.value) ? '✓' : '✕'} ${l}</span>`).join('');
  if (e.target.dataset.act === 'radius') $('#rv').textContent = e.target.value;
});
window.addEventListener('error', (e) => toast('Ошибка: ' + e.message, 'err'));

// ---------------- boot ----------------
let GLOBAL_CH = null;
async function onAuth(session) {
  SESSION = session;
  if (session) {
    PROFILE = await Q(sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle()).catch(() => null);
    await loadFavs().catch(() => 0);
    if (!GLOBAL_CH) GLOBAL_CH = sb.channel('inbox').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (pl) => { if (pl.new.sender_id !== uid()) refreshUnread(); }).subscribe();
  } else {
    PROFILE = null; FAVS = new Set(); UNREAD = 0;
    if (GLOBAL_CH) { sb.removeChannel(GLOBAL_CH); GLOBAL_CH = null; }
  }
}
(async () => {
  try { if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/'); } catch { location.hash = '#/'; }
  $('#app').innerHTML = spinner;
  let session = null;
  try { session = (await Promise.race([sb.auth.getSession(), new Promise((r) => setTimeout(() => r({ data: {} }), 4000))])).data?.session || null; } catch { /* */ }
  await onAuth(session).catch(() => 0);
  sb.auth.onAuthStateChange((ev, session) => {
    setTimeout(async () => {
      const changed = (session?.user?.id || null) !== uid();
      if (changed || ev === 'USER_UPDATED') await onAuth(session);
      if (ev === 'PASSWORD_RECOVERY') return go('#/reset');
      if (ev === 'SIGNED_IN' && /[?&]code=/.test(location.search)) { history.replaceState(null, '', location.pathname + '#/account'); toast('Email подтверждён! Добро пожаловать в VENDORA'); }
      if (changed) render();
    }, 0);
  });
  render();
})();

</script>
